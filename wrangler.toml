name = "thegrid-sync"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Optional self-hosting only, the public version also runs on managed hosting
# Replace this bucket name if deploying in a personal Cloudflare account
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "thegrid-shows"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]
